# Optional Postgres setup (the default `./run.sh` uses SQLite and needs no Docker).
services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: metering, POSTGRES_PASSWORD: metering, POSTGRES_DB: metering }
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U metering"], interval: 3s, retries: 20 }
  api:
    build: .
    depends_on: { db: { condition: service_healthy } }
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://metering:metering@db:5432/metering
    ports: ["8000:8000"]
